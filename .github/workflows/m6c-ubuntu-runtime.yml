name: AgentX Core Ubuntu Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m6c-ubuntu-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu-runtime:
    name: Ubuntu 24.04 / amd64 / Go 1.25.12
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOPRIVATE: github.com/wsnacj/agentx-go
      GONOSUMDB: github.com/wsnacj/agentx-go
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.12
          cache: false

      - name: Run M6C Ubuntu runtime matrix
        env:
          GOWORK: "off"
          CGO_ENABLED: "1"
        run: go run ./scripts/check_ubuntu_runtime.go
